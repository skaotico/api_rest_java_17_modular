plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'          // Plugin principal de Spring Boot
    id 'io.spring.dependency-management' version '1.1.7'   // Maneja versiones de dependencias automáticamente
}

group = 'com.skaotico'
version = '0.0.1-SNAPSHOT'
description = 'servicio rest java portafolio'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()  // Repositorio central de Maven
}

dependencies {
    // --- SPRING BOOT CORE ---
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // --- SEGURIDAD Y JWT (JSON Web Tokens) ---
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // --- BASE DE DATOS ---
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    implementation 'org.postgresql:postgresql:42.6.0'
    runtimeOnly 'org.postgresql:postgresql'

    // --- LOMBOK ---
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    // --- MAPSTRUCT / SERIALIZACIÓN ---
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

    // --- VALIDACIÓN (Jakarta Bean Validation) ---
    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'
    implementation 'org.hibernate.validator:hibernate-validator:8.0.1.Final'

    // --- MINIO (Almacenamiento Objetos) ---
    implementation 'io.minio:minio:8.5.10'

    // --- CÓDIGOS QR / BARRAS ---
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.zxing:javase:3.5.3'

    // --- TESTING ---
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // --- DOCUMENTACIÓN (OpenAPI / Swagger) ---
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.11'
}


tasks.named('test') {
    useJUnitPlatform()  // Habilita JUnit 5
}
